<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vikunja</title>
  <link rel="stylesheet" href="../styles/common.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img
      id="logo"
      src="../icons/icon-32.png"
      alt="Vikunja logo"
      width="28"
      height="28"
      role="button"
      tabindex="0"
      title="Open Vikunja"
      aria-label="Open Vikunja"
    />
    <input
      type="search"
      id="search"
      placeholder="Search tasks…"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search tasks"
    />
    <button id="open-settings" class="icon-btn" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <section id="config-prompt" class="view" hidden>
    <p class="empty">Vikunja is not configured yet.</p>
    <button id="go-settings" class="primary">Open settings</button>
  </section>

  <section id="loading" class="view" hidden>
    <p class="empty">Loading tasks&hellip;</p>
  </section>

  <section id="list" class="view" hidden>
    <form id="quick-add" class="quick-add">
      <input
        type="text"
        id="quick-title"
        name="title"
        placeholder="Add a task&hellip;"
        maxlength="500"
        autocomplete="off"
        spellcheck="false"
      />
      <select id="quick-project" title="Project"></select>
      <button type="submit" id="quick-add-btn" class="primary">Add</button>
    </form>
    <span id="quick-error" class="error" hidden></span>
    <button id="add-site" class="secondary add-site">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Add current website as task
    </button>

    <ul id="task-list" class="task-list"></ul>
    <p id="task-empty" class="empty" hidden>No tasks here yet.</p>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="../lib/vikunja.js"></script>
  <script src="../lib/quick-add.js"></script>
  <script src="../lib/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
